<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        Box => Каробка
        Bubble  =>  Пузырь
    -->
    <div class="box">
        <span class="b1"></span>
        <span class="b2"></span>
        <span class="b3"></span>
        <span class="b4"></span>
        <span class="b5"></span>
        <span class="b6"></span>
    </div>
</body>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition: 0.5s;
    }
    .box {
        width: 10%;
        height: 50px;
        margin: 0 auto;
        position: relative;
        animation: move 10s alternate infinite;
    }
    body { background-color: black; 
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box span {
        display: inline-block;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: red;

        position: absolute;
        animation-timing-function: linear;
    }
    .box .b1 { background: radial-gradient(circle, transparent, blue); 
        animation: b1 8s alternate infinite;
        left: 50px;
        top: 50px;
    }
    .box .b2 { background: radial-gradient(circle, transparent, red); 
        animation: b2 4s alternate infinite;
        left: 20px;
        bottom: 20px;
    }
    .box .b3 { background: radial-gradient(circle, transparent, orange); 
        animation: b3 5s alternate infinite;
        right: 20px;
        top: 50px;
    }
    .box .b4 { background: radial-gradient(circle, transparent, magenta);
        animation: b4 3s alternate infinite;
        bottom: 50px;
    }
    .box .b5 { background: radial-gradient(circle, transparent, yellow); 
        animation: b5 6s alternate infinite;
        top: 50px;
    }
    .box .b6 {  background: radial-gradient(circle, transparent, green); 
        animation: b6 5s alternate infinite;
        left: 50px;
        right: 20px;
    }


    @keyframes b1 {
        0% { transform: translate(100px, 100px) scale(2) }
        25% { transform: translate(-100px, 50px) scale(0.7) }
        50% { transform: translate(200px, 0px) scale(0.5) }
        100% { transform: translate(0, -100px) scale(1.2) }
    }
    @keyframes b2 {
        0% { transform: translate(-100px, -100px) scale(0.9) }
        25% { transform: translate(100px, -50px) scale(0.7) }
        50% { transform: translate(-200px, 0px) scale(2) }
        100% { transform: translate(-50px, 100px) scale(0.5) }
    }
    @keyframes b3 {
        0% { transform: translate(-150px, -50px) scale(1.5) }
        25% { transform: translate(-50px, 100px) scale(1) }
        50% { transform: translate(150px, 0px) scale(2) }
        100% { transform: translate(-50px, 150px) scale(0.5) }
    }
    @keyframes b4 {
        0% { transform: translate(200px, 50px) scale(1.5) }
        25% { transform: translate(-50px, -100px) scale(1) }
        50% { transform: translate(0px, 0px) scale(4) }
        100% { transform: translate(-50px, 0px) scale(0.5) }
    }
    @keyframes b5 {
        0% { transform: translate(50px, -200px) scale(0.5) }
        25% { transform: translate(-50px, 150px) scale(2) }
        50% { transform: translate(0px, 0px) scale(0.5) }
        100% { transform: translate(50px, -100px) scale(1.5) }
    }
    @keyframes b6 {
        0% { transform: translate(-50px, 200px) scale(0.5) }
        25% { transform: translate(50px, -150px) scale(2) }
        50% { transform: translate(-0px, 0px) scale(0.5) }
        100% { transform: translate(-50px, 100px) scale(1.5) }
    }


    @keyframes move { 
        0% { transform: translateY(0px) rotate(135deg); }
        25% { transform: translateY(100px) rotate(360deg); }
        50% { transform: translateY(-100px) rotate(0); }
        75% { transform: translateY(50px) rotate(45deg); }
        100% { transform: translateY(0px) rotate(0); }
    }

</style>
</html>
