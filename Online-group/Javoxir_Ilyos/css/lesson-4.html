<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <aside>
            <h2>🤖<span>Logo</span></h2>
            <div class="links">
                <a href="#" class="link">
                    🏠<span>Home</span>
                </a>
                <a href="#" class="link">
                    🔍<span>About</span>
                </a>
                <a href="#" class="link">
                    📞<span>Contact</span>
                </a>
                <a href="#" class="link">
                    💼<span>Services</span>
                </a>
                <a href="#" class="link">
                    📝<span>Blog</span>
                </a>
                <a href="#" class="link">
                    🔑<span>Login</span>
                </a>
            </div>
            <button id="toggler-menu">
                >
            </button>
        </aside>
        <div class="main-content">
            <h1>Hello world</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Officia necessitatibus nostrum distinctio
                assumenda architecto, nam suscipit sit illo ex consequatur optio harum sequi nulla facilis totam quo
                ipsam deleniti minima?</p>
        </div>
    </main>


    <script>
        const togglerMenu = document.getElementById('toggler-menu');
        const main = document.querySelector('main');
        togglerMenu.onclick = function () {
            main.classList.toggle('active');
        }
    </script>
</body>
<style>
    main>aside {
        width: 6%;
        background-color: #0060fb;
        height: 100vh;
        position: relative;
    }

    main>.main-content {
        width: 94%;
    }

    main.active>aside {
        width: 15%;
    }

    main.active>.main-content {
        width: 85%;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition: 0.5s;
    }

    main {
        width: 100%;
        min-height: 100vh;
    }

    main>div,
    main>aside {
        float: left;
        text-align: center;
        padding: 20px 0;
    }

    main>.main-content {
        padding-left: 20px;
        overflow: auto;
        height: 100vh;
    }

    main>aside a.link {
        display: block;
        color: snow;
        text-decoration: none;
        width: 100%;
        padding: 10px;
        margin-bottom: 5px 0;
    }

    main>aside>h2 {
        margin-bottom: 50px;
    }

    main>aside a.link:hover {
        background-color: #4d90fa;
    }

    main>aside span {
        display: none;
    }

    main.active>aside span {
        display: inline-block;
    }

    #toggler-menu {
        width: 15px;
        height: 30px;
        border: none;
        background-color: transparent;
        border-radius: 5px;
        cursor: pointer;
        background-color: #0060fb;
        color: snow;
        border: 1px solid snow;
        position: absolute;
        left: 100%;
        bottom: 5px;
    }

    main.active #toggler-menu {
        transform: rotate(180deg);
    }
</style>

</html>
