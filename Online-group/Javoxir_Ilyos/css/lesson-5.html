<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- 
        pseudo-class ->  changes the whole tag's style
                     RU: псевдоклассы меняют стили всего тега
            SYNTAX: a:link { color: orange; }
        ---------------------------------------------------
        pseudo-element  ->  changes the part of the tag
                     RU: псевдоэлементы меняют часть тега
            SYNTAX: a::before { content: "Hello"; }
        ---------------------------------------------------
        PSEUDO-CLASSes 
            a:link { color: orange; }
            a:visited { color: red; }
            a:hover { color: green; }
            a:active { color: blue; }

            focus  ->  changes the style of the input when it is focused
                    RU: меняет стиль ввода, когда он находится в фокусе
            checked -> changes the style of the checkbox when it is checked
                    RU: меняет стиль чекбокса, когда он отмечен
        ===================================================================
        PSEUDO-ELEMENTs
            ::marker
            ::selection
            ::first-letter
            ::placeholder
            ::before
            ::after
    -->

    <main>
        <input type="text" placeholder="Enter your name">
        <input type="checkbox" >
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nulla ea voluptates, consequatur obcaecati sint
            voluptatibus! Id, doloribus. Sunt cupiditate eum ipsa qui, quisquam dolorem, error velit harum doloremque
            hic doloribus!</p>

        <ul>
            <li>
                <a href="#1">Link</a>
            </li>
            <li>
                <a href="#2">Link</a>
            </li>
            <li>
                <a href="#3">Link</a>
            </li>
        </ul>
    </main>

</body>
<style>
    main {
        width: 50%;
        margin: 0 auto;
        padding: 10px;
        background-color: #eee;
    }

    main a {
        display: inline-block;
        width: 150px;
        border-radius: 10px;
        text-decoration: none;
        padding: 10px;
        background-color: #333;
        color: snow;
    }

    main input {
        display: block;
        width: 200px;
        margin: 10px auto;
        border-radius: 10px;
        border: none;
        outline: none;
        background-color: lightgray;
        padding: 10px 20px;
    }

    main input:focus {
        background-color: green;
        color: snow;
    }

    main input[type="checkbox"]:checked~p {
        color: red;
    }
    li::marker {
        color: red;
    }

    ::selection {
        background-color: brown;
        color: yellow;
    }

    ::first-letter {
        font-size: 1.5em;
        color: red;
    }

    ::placeholder {
        color: orange;
    }


    li {
        position: relative;
    }
    li::before {
        content: "";
        width: 20px;
        height: 20px;
        position: absolute;
        top: 15px;
        left: -20px;
        background: url(1.jpg);
        background-size: cover;
        border-radius: 50%;
        display: none;
    }
    li:hover::before {
        display: block;
    }
    li::after {
        content: "🔥";
    }
</style>
</html>
