<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- 
        =====================================================================
        - Introduction / syntax / stylesheet / all selectors

        SYNTAX: selector { property: value; }
        SELECTORS:
            -> SIMPLE SELECTORS:  #id, .class, tag-name
                ex:
                    /* level 3 */
                    li {  color: red; }
                    
                    /* level 2 */
                    .cls-li-1, .cls-li-2 { color: blue; }
                
                    /* level 1 */
                    #li-2 { color: green; }
            -----------------------------------------------
            -> Ancestors  =>  наследуется от родителя
                    ul li { color: red; }
                    ul li span{ color: blue; }
            -----------------------------------------------
            -> Children  =>  наследуется от родителя
                    .main > p { color: red; }
            -----------------------------------------------
            -> Sibling  (chooses next all siblings)
                p ~ div { color: red; }
            -----------------------------------------------
            -> Adjacent (chooses next only one sibling)
                p + div { color: red; }
            -----------------------------------------------
            -> Attribute
                div[title] { color: red; }
            -----------------------------------------------
            -> *   ->  selects all elements
            -----------------------------------------------
        =====================================================================
        =====================================================================
        - Colours && gradients & text-(decoration, transform and spacing)

            -> rgb(0,0,0,0) -> red (0-255),green (0-255),blue (0-255), transparency (0-1)
                --------------------------------------------------------------
            -> #hex-color   -> #000000   => 0-9, a-f
                --------------------------------------------------------------
            -> linear-gradient(direction, #000000, #ffffff)
                    - directions: to right, to left, to top, to bottom, to top right, to top left, to bottom right, to bottom left
                --------------------------------------------------------------
            -> radial-gradient(shape, #000000, #ffffff)
                    - shape: circle, ellipse(-default)
                --------------------------------------------------------------
            -> text-decoration: syle type thickness color
                    - style: 
                        solid   =>  ___________________
                        dotted  =>  . . . . . . . . . .
                        dashed  =>  _ _ _ _ _ _ _ _ _ _
                        double  =>  ===================
                        wavy    =>  ~~~~~~~~~~~~~~~~~~~
                    - type:
                        underline || overline || line-through
                    - thickness:
                        1px || 10px || ...px
                    - color:
                        #hex-color || rgb(0,0,0,0) || rgba(0,0,0,0) || ...
                --------------------------------------------------------------
            -> text-transform: uppercase || lowercase || capitalize
                    - uppercase  => ALL CAPS
                    - lowercase  => all small caps
                    - capitalize => First Letter Of Each Word Is Uppercase
                --------------------------------------------------------------
            -> letter-spacing: 1px || 10px || ...px  (отступ между буквами)
                --------------------------------------------------------------
            -> word-spacing: 1px || 10px || ...px  (отступ между словами)
                --------------------------------------------------------------
            -> line-height: 1px || 10px || ...px  (отступ между строками)


        =====================================================================
        =====================================================================
        - Borders 
            SYNTAX: border: style thickness color;

            -> style:
                solid   =>  ___________________
                dotted  =>  . . . . . . . . . .
                dashed  =>  _ _ _ _ _ _ _ _ _ _
                double  =>  ===================
                inset   =>  3d изнутри
                outset  =>  3d снаружи
                groove  =>  3d с inset+outset
                ridge   =>  3d с outset+inset
            --------------------------------------------------------------
            border-radius: 10px ||  10px 20px 30px 40px;

                1-value  => все 4 угла
                4-values => clockwise (top-left, top-right, bottom-right, bottom-left)

        =====================================================================
        - backgrounds
            background-color: #000000;  => цвет фона

            background-image: url(...);
            background-repeat: no-repeat; (repeat=default)
            background-size: cover; (contain=default)
            background-position: center;
            background-attachment: fixed;
    } -->


</body>
</html>
