<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Adding elements to demonstrate CSS properties -->
    <div class="container">
        <h1>Welcome to the CSS Task</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Error vitae doloribus odio suscipit, ipsa ullam nisi rerum. Voluptatibus aspernatur cupiditate doloremque quibusdam rerum laudantium error, blanditiis quam rem? Atque, magnam.</p>
    </div>
</body>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #ff7e5f, #feb47b, #4286f4, #373B44, #4286f4);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        border: ridge 15px #333;
    }

    .container {
        text-align: center;
        padding: 40px;
        border: outset 12px #444;
        background: radial-gradient(ellipse, #2193b0, #6dd5ed, #2193b0, #6dd5ed);
    }

    h1 {
        text-transform: uppercase;
        text-decoration: wavy 5px #333;
        letter-spacing: 8px;
        word-spacing: 15px;
        line-height: 2;
        color: #fff;
        border-bottom: double 6px #333;
    }

    p {
        text-transform: lowercase;
        text-decoration: dotted 4px #222;
        letter-spacing: 3px;
        word-spacing: 8px;
        line-height: 2.5;
        color: #333;
        border: dashed 3px #444;
        padding: 20px;
    }
</style>

</html>
